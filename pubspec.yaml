name: tandem
description: Tandem - Connect your phone and PC seamlessly over local Wi-Fi.
publish_to: 'none'
version: 1.0.0+7

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: ^7.0.0
  crypto: ^3.0.6
  device_info_plus: ^13.0.0
  dio: ^5.9.0
  file_picker: ^13.0.0
  flutter_secure_storage: ^11.0.0
  mobile_scanner: ^7.0.0
  nsd: ^5.0.0
  path: ^1.9.1
  path_provider: ^2.1.5
  receive_sharing_intent: ^1.9.0
  shared_preferences: ^2.5.0
  sqflite: ^2.4.0
  workmanager: ^0.10.0
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#14213D"
  adaptive_icon_foreground: "assets/logo_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
